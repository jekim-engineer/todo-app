<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>To Do</h1>
      <div class="color-pickers">
        <label class="color-picker-label">
          배경색
          <input type="color" id="bg-color-picker" class="color-picker-input" value="#f9fafb" />
        </label>
        <label class="color-picker-label">
          글자색
          <input type="color" id="text-color-picker" class="color-picker-input" value="#1f2937" />
        </label>
      </div>
    </header>

    <section id="progress-area" class="progress-area">
      <p id="progress-text" class="progress-text">오늘 0 / 0 완료 (0%)</p>
      <div class="progress-bar">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
      <ul id="progress-category-list" class="progress-category-list"></ul>
    </section>

    <section id="todo-form-area" class="todo-form-area">
      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        />
        <div class="due-date-field">
          <input
            type="date"
            id="todo-due-date-input"
            class="todo-due-date-input"
          />
          <span id="due-date-placeholder" class="due-date-placeholder">일정 설정</span>
        </div>
        <select id="todo-category-select" class="todo-category-select">
          <option value="work">업무</option>
          <option value="personal">개인</option>
          <option value="study">공부</option>
        </select>
        <button type="submit" class="add-btn">추가</button>
      </form>
      <p id="category-hint" class="category-hint"></p>
    </section>

    <nav id="category-tabs" class="category-tabs">
      <button type="button" class="tab-btn active" data-category="all">전체</button>
      <button type="button" class="tab-btn" data-category="work">업무</button>
      <button type="button" class="tab-btn" data-category="personal">개인</button>
      <button type="button" class="tab-btn" data-category="study">공부</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
